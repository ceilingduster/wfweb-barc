# Run on the remote Raspberry Pi beside a native wfweb installation.
services:
  connector:
    build:
      context: ../..
      dockerfile: deploy/node/Dockerfile
    restart: unless-stopped
    env_file: .env
    network_mode: host
    uts: host
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - node-state:/data

volumes:
  node-state:
